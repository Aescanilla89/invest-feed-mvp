name: Reparar precios tras stock split

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Reparar de verdad (sin marcar, solo detecta y lista candidatos)"
        type: boolean
        default: false
      tickers:
        description: "Símbolos concretos a reparar, separados por coma (vacío = detección automática)"
        type: string
        default: ""

jobs:
  repair-split-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python scripts/repair_split_prices.py \
            ${{ github.event.inputs.apply == 'true' && '--apply' || '' }} \
            ${{ github.event.inputs.tickers != '' && format('--tickers "{0}"', github.event.inputs.tickers) || '' }}
