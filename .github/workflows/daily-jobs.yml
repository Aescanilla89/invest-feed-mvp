name: Daily jobs

on:
  schedule:
    # 06:00 UTC — mismo horario que el antiguo scheduler de Railway
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_institutional:
        description: "Forzar actualización de institutional_holdings (13F) aunque no sea lunes"
        type: boolean
        default: false

jobs:
  run-daily-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_daily_jobs.py
        env:
          PYTHONPATH: .
          FORCE_INSTITUTIONAL: ${{ github.event.inputs.force_institutional }}
