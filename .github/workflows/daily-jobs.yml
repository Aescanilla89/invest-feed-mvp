name: Daily jobs

on:
  schedule:
    # 05:00 Europe/Madrid: 03:00 UTC in summer (CEST), 04:00 UTC in winter (CET).
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force_institutional:
        description: "Forzar actualización de institutional_holdings (13F) aunque no sea lunes"
        type: boolean
        default: false
      clear_explanations:
        description: "Borrar el historial de explicaciones IA antes de correr (fuerza regeneración completa, p.ej. tras cambiar el tono del prompt)"
        type: boolean
        default: false

jobs:
  run-daily-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar franja horaria de Madrid
        id: check_schedule
        working-directory: .
        run: |
          if "${{ github.event_name }}" != "schedule"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          offset=$(TZ=Europe/Madrid date +%z)
          schedule="${{ github.event.schedule }}"

          if { [ "$schedule" = "0 3 * * *" ] && [ "$offset" = "+0200" ]; } ||
             { [ "$schedule" = "0 4 * * *" ] && [ "$offset" = "+0100" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Ejecutando el job diario para las 05:00 Europe/Madrid (offset $offset)."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Esta entrada cron no corresponde a las 05:00 Europe/Madrid (schedule=$schedule, offset=$offset)."
          fi

      - uses: actions/setup-python@v5
        if: steps.check_schedule.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.check_schedule.outputs.should_run == 'true'

      - if: ${{ steps.check_schedule.outputs.should_run == 'true' && github.event.inputs.clear_explanations == 'true' }}
        run: python scripts/clear_explanations.py
        env:
          PYTHONPATH: .

      - run: python scripts/run_daily_jobs.py
        if: steps.check_schedule.outputs.should_run == 'true'
        env:
          PYTHONPATH: .
          FORCE_INSTITUTIONAL: ${{ github.event.inputs.force_institutional }}
