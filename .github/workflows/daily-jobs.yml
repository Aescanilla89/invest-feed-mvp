name: Daily jobs

on:
  schedule:
    # 06:00 UTC — mismo horario que el antiguo scheduler de Railway
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_institutional:
        description: "Forzar actualización de institutional_holdings (13F) aunque no sea lunes"
        type: boolean
        default: false
      clear_explanations:
        description: "Borrar el historial de explicaciones IA antes de correr (fuerza regeneración completa, p.ej. tras cambiar el tono del prompt)"
        type: boolean
        default: false

jobs:
  run-daily-jobs:
    runs-on: ubuntu-latest
    # Universo ampliado a ~2600 tickers (antes ~600) tras añadir Russell 2000.
    # 90 min tampoco bastó (visto en producción): el screener solo ya tarda
    # ~74 min, y la búsqueda de Form 4 (insiders) en EDGAR para ~2400 tickers
    # necesita otros ~20 min (estaba casi terminada, no colgada, cuando el
    # timeout de 90 min la cortó) -- total real ≈100 min. 180 min da margen
    # amplio y sigue muy por debajo del límite duro de 360 min de Actions.
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - if: ${{ github.event.inputs.clear_explanations == 'true' }}
        run: python scripts/clear_explanations.py
        env:
          PYTHONPATH: .
      - run: python scripts/run_daily_jobs.py
        env:
          PYTHONPATH: .
          FORCE_INSTITUTIONAL: ${{ github.event.inputs.force_institutional }}
