name: Backtest cartera pública

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "Nº de semanas hacia atrás (vacío = desde el inicio histórico de la cartera, 1/09/2025)"
        type: string
        default: ""
      tickers:
        description: "Override de tickers separados por coma (vacío = S&P500+Nasdaq100 completo)"
        type: string
        default: ""
      institutions:
        description: "Override de instituciones 13F separadas por coma (vacío = las 30 de producción)"
        type: string
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    # Universo: S&P500 + Nasdaq100 (~600 tickers). Antes 180 min bastaba
    # (última corrida completa: 2h43m) -- tras reparar el histórico de 50
    # tickers con más semanas de datos (ver scripts/repair_split_prices.py),
    # la corrida de 2026-09-04 se quedó a 46/52 semanas al llegar al límite
    # de 3h, así que se amplía el margen.
    timeout-minutes: 300
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python -m app.jobs.backtest_portfolio \
            ${{ github.event.inputs.weeks != '' && format('--weeks {0}', github.event.inputs.weeks) || '' }} \
            ${{ github.event.inputs.tickers != '' && format('--tickers {0}', github.event.inputs.tickers) || '' }} \
            ${{ github.event.inputs.institutions != '' && format('--institutions {0}', github.event.inputs.institutions) || '' }}
